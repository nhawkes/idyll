name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix crates/idyll-serve/runtime/harness
      - run: cargo test --workspace --locked
      - run: cargo build --locked --target wasm32-wasip2 -p todo-app -p todo-islands-app -p todo-form-app -p todo-spa-app
