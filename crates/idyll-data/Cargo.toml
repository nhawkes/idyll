[package]
name = "idyll-data"
version = "0.1.0"
edition = "2021"
description = "Vibe coded web framework"
license = "MIT"
repository = "https://github.com/nhawkes/idyll"

[dependencies]
idyll = { version = "0.1.0", path = "../idyll" }
idyll-macros = { version = "0.1.0", path = "../idyll-macros" }
idyll-schema = { version = "0.1.0", path = "../idyll-schema" }
derive-where = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
idyll = { path = "../idyll", features = ["testing"] }

[features]
default = ["registry"]
# The host-only persisted-query registry (filesystem + git). Off for the wasm guest.
registry = []
