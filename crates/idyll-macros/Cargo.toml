[package]
name = "idyll-macros"
version = "0.1.0"
edition = "2021"
description = "Vibe coded web framework"
license = "MIT"
repository = "https://github.com/nhawkes/idyll"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
# The client macros read the published schema.json at expansion time (fragment!/query!/
# mutation! validate selections and generate projections from it).
idyll-schema = { version = "0.1.0", path = "../idyll-schema" }
idyll-wit = { version = "0.1.0", path = "../idyll-wit" }
idyll-styles-parse = { version = "0.1.0", path = "../idyll-styles-parse" }
serde_json = { workspace = true }
