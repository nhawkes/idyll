[package]
name = "idyll-host"
version = "0.1.0"
edition = "2021"
description = "Vibe coded web framework"
license = "MIT"
repository = "https://github.com/nhawkes/idyll"

[dependencies]
wasmtime = { version = "46", features = ["component-model", "runtime", "cranelift"] }
wasmtime-wasi = "46"
anyhow = { workspace = true }
thiserror = "2"
# The membrane speaks idyll's own command vocabulary at its edge: `mount` streams
# convert to `DomCommand` for the host's HTML fold.
idyll = { version = "0.1.0", path = "../idyll" }
idyll-wit = { version = "0.1.0", path = "../idyll-wit", features = ["host"] }

