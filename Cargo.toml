[workspace]
members = [
    "crates/idyll",
    "crates/idyll-host",
    "crates/idyll-macros",
    "crates/idyll-route",
    "crates/idyll-data",
    "crates/idyll-schema",
    "crates/idyll-serve",
    "crates/idyll-styles",
    "crates/idyll-styles-parse",
    "examples/todo/app",
    "examples/todo/server",
    "examples/todo-islands/app",
    "examples/todo-islands/server",
    "examples/todo-form/app",
    "examples/todo-form/server",
    "examples/todo-spa/app",
    "examples/todo-spa/server",
]
resolver = "2"

# Dependencies carry no debuginfo — wasmtime/tokio with full debug produce rlibs so large
# that linking exhausts the paging file on this box (os error 1455). Our own crates keep
# full debug for a good dev experience.
[profile.dev.package."*"]
debug = false

# Binaryen is C++ compiled by cc; at /Od its passes take minutes on a real module.
[profile.dev.package.wasm-opt-sys]
opt-level = 2

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["full"] }
anyhow = "1"
derive-where = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
bon = "3"
notify = "6"
tokio-stream = { version = "0.1", features = ["sync"] }
